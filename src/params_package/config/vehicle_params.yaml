core_controller_node:
  ros__parameters:
    # === 차량 물리 제원 (단위: 미터) ===
    wheel_radius: 0.033
    track_width: 0.13

    # === 제어 파라미터 ===
    max_pwm: 255.0

    # === 안전을 위한 최대 속도 제한값 (자율 모드에서 사용) ===
    max_linear_velocity_limit: 0.88
    # 자율 모드 최대 각속도 제한 (단위: deg/s)
    max_angular_velocity_limit: 860.0 # 15.0 rad/s

teleop_node:
  ros__parameters:
    # === 조작 모드 선택 ===
    # "skid_steer" 또는 "ackermann_sim" 중 하나를 선택 (기본값)
    steering_mode: "ackermann_sim" 

    # === 조이스틱 공통 파라미터 ===
    calibration_file: "/root/ros_ws/src/joystick_cal.yaml"
    expo_factor: 0.7

    # === 조이스틱 축 매핑 ===
    axis_linear: 1
    axis_angular: 2
    
    # === 조이스틱 축 방향 반전 계수 (부호 보정용) ===
    scale_linear: 1.0
    scale_angular: 1.0
    
    # === 버튼 매핑 ===
    button_toggle_manual: 1           # O
    button_request_parking: 2         # ㅁ
    button_request_path: 3            # △
    button_request_cancel: 0          # X
    button_left_blinker: 4            # L1
    button_right_blinker: 5           # R1
    button_toggle_steering_1: 10      # L3
    button_toggle_steering_2: 11      # R3

    # --- 스키드 스티어 모드 전용 파라미터 ---
    skid_max_linear_velocity: 0.88
    # 스키드 스티어 모드 최대 각속도 (단위: deg/s)
    skid_max_angular_velocity: 255.0 # 4.5 rad/s
    linear_sensitivity: 1.0
    steering_sensitivity: 0.7

    # === 아커만 시뮬레이션 전용 파라미터 ===
    wheelbase: 0.13
    max_steering_angle: 35.0 # 이전 0.6109 rad
    ackermann_max_linear_velocity: 0.792

# --- [추가] ros2_odometry_estimation 노드를 위한 섹션 ---
odometry_estimation_node:
  ros__parameters:
    # 이 노드는 이 두 파라미터만 필요로 함
    wheel_radius: 0.033
    track_width: 0.13
