# params_package/config/pure_pursuit.yaml
pure_pursuit_node:
  ros__parameters:
    # --- Pure Pursuit 알고리즘 파라미터 ---
    k: 0.5                  # 속도 비례 look-ahead 게인 (Lf = k*v + Lfc)
    Lfc: 0.8                # 최소 look-ahead 거리 (m)
    Kp: 1.0                 # (코드상에서는 현재 사용되지 않는 것으로 보임) 속도 비례 게인
    
    # --- 제어 루프 파라미터 ---
    dt: 0.1                 # 제어 주기 (초). 10Hz에 해당.
    goal_threshold: 0.4     # 목표 지점 도착으로 간주할 거리 (m)
    
    # --- 속도 및 가속도 제한 ---
    max_acceleration: 0.08  # 최대 가속도 (m/s^2)
    minVelocity: 0.4        # 최소 주행 속도 (m/s)
    maxVelocity: 0.7        # 최대 주행 속도 (m/s)
    maxAngularVelocity: 1.3 # 최대 각속도 (rad/s)
    
    # --- 곡률 기반 속도 제어 파라미터 ---
    minCurvature: 0.0       # 곡률 최소값
    maxCurvature: 5.0       # 곡률 최대값
    
    # --- 장애물 회피 파라미터 ---
    obstacle_th: 0.5        # 장애물로 인식할 거리 임계값 (m)
